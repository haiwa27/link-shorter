global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Beide Produktionsslots werden dauerhaft abgegriffen, auch der untätige.
  # Nur so ist nach dem Umschalten sofort eine Zeitreihe für den neuen Slot da.
  - job_name: healthgate-prod
    metrics_path: /metrics
    static_configs:
      - targets: ["app-blue:8080"]
        labels:
          umgebung: prod
      - targets: ["app-green:8080"]
        labels:
          umgebung: prod

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
