name: healthgate-staging

# Der Projektname ist nur die Vorgabe für den Handbetrieb. Die Pipeline setzt
# ihn je Branch über -p, damit zwei gleichzeitig laufende Builds sich nicht
# gegenseitig den Stack abräumen. Aus demselben Grund trägt das Netz hier
# keinen festen Namen: Compose leitet ihn vom Projektnamen ab.

services:
  app:
    # Dasselbe Image, das anschliessend nach Produktion geht. Staging prueft
    # sonst etwas anderes als das, was ausgeliefert wird (Entscheidung E-013).
    image: ${HEALTHGATE_IMAGE:?HEALTHGATE_IMAGE muss gesetzt sein, z.B. healthgate:abc1234}
    environment:
      HEALTHGATE_UMGEBUNG: staging
      HEALTHGATE_SLOT: staging
      HEALTHGATE_VERSION: ${HEALTHGATE_VERSION:-dev}
      HEALTHGATE_CHAOS_RATE: "0.0"
      HEALTHGATE_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      # STAGING_PORT=0 laesst Docker einen freien Port waehlen. Die Pipeline
      # nutzt das, damit parallele Builds sich nicht um 8081 streiten.
      - "${STAGING_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-staging:/var/lib/postgresql/data
      - ../app/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-staging:
