name: healthgate-prod

# Beide Slots laufen gleichzeitig (Story R-01). Nur einer bekommt Verkehr --
# welcher, entscheidet die Datei caddy/active-slot.conf.

# Kein build hier: das Image wird einmal gebaut, gegen Staging geprueft und
# genau so nach Produktion gestellt. Baute Produktion neu, waere das
# ausgelieferte Artefakt ein anderes als das getestete (Entscheidung E-013).
x-app: &app
  image: ${HEALTHGATE_IMAGE:?HEALTHGATE_IMAGE muss gesetzt sein, z.B. healthgate:abc1234}
  environment: &app-env
    HEALTHGATE_UMGEBUNG: prod
    HEALTHGATE_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  app-blue:
    <<: *app
    environment:
      <<: *app-env
      HEALTHGATE_SLOT: blue
      HEALTHGATE_VERSION: ${VERSION_BLUE:-dev}
      HEALTHGATE_CHAOS_RATE: ${CHAOS_BLUE:-0.0}

  app-green:
    <<: *app
    environment:
      <<: *app-env
      HEALTHGATE_SLOT: green
      HEALTHGATE_VERSION: ${VERSION_GREEN:-dev}
      HEALTHGATE_CHAOS_RATE: ${CHAOS_GREEN:-0.0}

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      # Das ganze Verzeichnis und nicht die einzelnen Dateien: ein Mount auf
      # eine Einzeldatei haengt an deren Inode. Wird die Datei ersetzt statt
      # ueberschrieben -- was jedes git checkout und jedes mv tut -- sieht der
      # Container weiter den alten Inhalt, ohne dass etwas fehlschlaegt.
      - ./caddy:/etc/caddy:ro
    depends_on:
      - app-blue
      - app-green
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-prod:/var/lib/postgresql/data
      - ../app/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-prod:

networks:
  default:
    name: healthgate
